name: Build branch (same build as the deploys)

# Every branch gets the exact build the two deploy workflows run — the
# Cloudflare edition and the GitHub Pages edition, standalone.html included —
# checked and kept as workflow artifacts. Nothing is deployed from here:
# oasforge.dev is deployed from main (deploy-cf.yml) and the GitHub Pages
# mirror from the branch chosen in deploy.yml.

on:
  push:
    branches-ignore: ['pages/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Cloudflare edition (dist-cf)
        run: node build-cf.js
      - name: Build GitHub Pages edition (dist-pages)
        run: node build-cf.js --base /swagger-dark-ui --out dist-pages
      - name: Check the builds
        run: |
          test -s dist-cf/index.html
          test -s dist-cf/app/index.html
          test -s dist-cf/standalone.html
          test -s dist-pages/app/index.html
          for f in apigee jmeter jmeter-wizard; do
            test -s "dist-cf/app/js/$f.js"
            grep -q "js/$f.js" dist-cf/app/index.html
          done
          for f in js/*.js build-cf.js build-standalone.js site-cf/pages.js; do node --check "$f"; done
      - name: Keep the Cloudflare build
        uses: actions/upload-artifact@v4
        with:
          name: dist-cf
          path: dist-cf
          retention-days: 7
      - name: Keep the GitHub Pages build
        uses: actions/upload-artifact@v4
        with:
          name: dist-pages
          path: dist-pages
          retention-days: 7
      - name: Keep standalone.html
        uses: actions/upload-artifact@v4
        with:
          name: standalone.html
          path: dist-cf/standalone.html
          retention-days: 7
      - name: Summary
        run: |
          {
            echo "## Branch build"
            echo
            echo "- Branch: \`${{ github.ref_name }}\` (\`${{ github.sha }}\`)"
            echo "- Artifacts: dist-cf, dist-pages, standalone.html"
            echo "- To serve this branch on GitHub Pages: Actions -> Deploy to GitHub Pages -> Run workflow -> pick \`${{ github.ref_name }}\`."
          } >> "$GITHUB_STEP_SUMMARY"
