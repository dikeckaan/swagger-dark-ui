name: Deploy to GitHub Pages

# The GitHub Pages mirror (kaandikec.com/swagger-dark-ui) serves ONE chosen
# branch, built exactly like oasforge.dev: landing page at the root, the app
# under /app/, guides, standalone.html. oasforge.dev itself is always main
# (deploy-cf.yml).
#
# How it works: the chosen branch is built with build-cf.js and the output is
# force-pushed to the `gh-pages` branch (one orphan commit, so its history
# never grows); GitHub then publishes that branch. Pages has to be set to
# "Deploy from a branch" -> gh-pages / (root) — the workflow sets that itself
# when the token may, and says so in the job summary otherwise. Serving a
# source branch directly would show the bare app with no landing page.
#
# Choosing the branch: Actions -> "Deploy to GitHub Pages" -> Run workflow,
# pick the branch in the dropdown (or type one into the `branch` input). It
# is deployed right away and its name is written to `.source-branch` on
# gh-pages, so every later push to it redeploys the mirror — until another
# branch is chosen the same way. With no choice made the mirror follows
# main. Pushes to any other branch leave Pages alone.
on:
  push:
    branches-ignore: ['gh-pages', 'pages/**']
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to serve on GitHub Pages (empty = the branch selected above)'
        required: false
        default: ''

permissions:
  contents: write   # push the built site to gh-pages
  pages: write      # point the Pages source at gh-pages

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ inputs.branch || github.ref_name }}
    steps:
      - name: Checkout ${{ inputs.branch || github.ref_name }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}

      # A push deploys only when it lands on the branch the mirror follows:
      # the one named in .source-branch on gh-pages, main when there is none.
      # A manual run always deploys the branch it was given.
      - name: Is this the branch the mirror follows?
        id: chosen
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          follows=$( (git fetch -q --depth 1 origin gh-pages && git show FETCH_HEAD:.source-branch) 2>/dev/null | tr -d '[:space:]' || true)
          follows=${follows:-main}
          echo "The mirror follows: $follows"
          if [ "$follows" = "$BRANCH" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
            echo "Not the followed branch — nothing to deploy. To serve $BRANCH: Actions -> Deploy to GitHub Pages -> Run workflow -> pick it."
          fi
      - name: Build the site (same build as the Cloudflare edition)
        if: steps.chosen.outputs.yes == 'true'
        run: node build-cf.js --base /swagger-dark-ui --out dist-pages
      - name: Check the build
        if: steps.chosen.outputs.yes == 'true'
        run: |
          test -s dist-pages/index.html
          test -s dist-pages/app/index.html
          test -s dist-pages/standalone.html
          grep -q 'class="landing-bg"' dist-pages/index.html

      # The whole site as one orphan commit on gh-pages, force-pushed: GitHub's
      # own pages-build-deployment then publishes it. .source-branch records
      # which branch the mirror follows from now on.
      - name: Publish the site to gh-pages
        if: steps.chosen.outputs.yes == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          sha=$(git rev-parse --short=12 HEAD)
          touch dist-pages/.nojekyll
          printf '%s\n' "$BRANCH" > dist-pages/.source-branch
          cd dist-pages
          git init -q -b build
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "GitHub Pages build of $BRANCH @ $sha"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/gh-pages"
          echo "gh-pages now holds the build of $BRANCH @ $sha"

      # Pages must publish gh-pages, not a source branch. Set it when the
      # token is allowed to; otherwise say exactly what to click.
      - name: Point GitHub Pages at gh-pages
        if: steps.chosen.outputs.yes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          want='{"source":{"branch":"gh-pages","path":"/"}}'
          current=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '(.build_type // "") + " " + (.source.branch // "") + " " + (.source.path // "")' 2>/dev/null || echo "none")
          echo "Pages source now: $current"
          case "$current" in
            "legacy gh-pages /") echo "Pages already publishes gh-pages." ;;
            none)
              echo "$want" | gh api -X POST "repos/$GITHUB_REPOSITORY/pages" --input - >/dev/null \
                && echo "Pages enabled from gh-pages." \
                || echo "::warning::Could not enable GitHub Pages. Settings -> Pages -> Build and deployment -> Source: Deploy from a branch, Branch: gh-pages / (root)." ;;
            *)
              echo "$want" | gh api -X PUT "repos/$GITHUB_REPOSITORY/pages" --input - >/dev/null \
                && echo "Pages source switched to gh-pages." \
                || echo "::warning::Pages still publishes '$current'. Switch it once: Settings -> Pages -> Build and deployment -> Source: Deploy from a branch, Branch: gh-pages / (root). Until then the mirror shows the bare app of that branch without the landing page." ;;
          esac

      - name: Summary
        if: steps.chosen.outputs.yes == 'true'
        run: |
          {
            echo "## GitHub Pages"
            echo
            echo "- Built branch: \`$BRANCH\` → pushed to \`gh-pages\` (landing page at the root, app under /app/)."
            echo "- The mirror now follows \`$BRANCH\`: every push to it rebuilds gh-pages, until another branch is chosen with Run workflow."
            echo "- Pages source must be: Deploy from a branch → gh-pages / (root). See the step above."
            echo "- oasforge.dev (Cloudflare) is deployed from \`main\` only."
          } >> "$GITHUB_STEP_SUMMARY"
