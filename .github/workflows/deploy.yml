name: Deploy to GitHub Pages (gh-pages branch)

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages source must be "Deploy from a branch" → gh-pages / (root).
permissions:
  contents: write

concurrency:
  group: pages-branch
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Cloudflare-equivalent site for GitHub Pages
        run: node build-cf.js --base /swagger-dark-ui --out dist-pages

      - name: Publish built landing site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist-pages
          force_orphan: true
          enable_jekyll: false
          commit_message: "deploy: publish welcome page and app from ${{ github.sha }}"
