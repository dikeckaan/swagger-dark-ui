<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="OASForge: write, validate, preview and mock OpenAPI documents in your browser — dark-themed, offline-capable, nothing leaves the page." />
  <title>OASForge — The OpenAPI Workbench</title>
  <script>
    // Apply saved theme before first paint to avoid a flash of wrong theme.
    (function () {
      try {
        var t = localStorage.getItem('sdui-theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
        }
        var p = localStorage.getItem('sdui-palette');
        if (p && ['default', 'nord', 'dracula', 'catppuccin'].indexOf(p) !== -1) {
          document.documentElement.setAttribute('data-palette', p);
        }
      } catch (e) { /* localStorage unavailable — keep defaults */ }
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cg fill='none' stroke='%2358a6ff' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M8.2 2.6 C5.9 2.6 6.6 5.4 6.3 7.6 C6.1 9.3 5.6 10.6 3.6 12 C5.6 13.4 6.1 14.7 6.3 16.4 C6.6 18.6 5.9 21.4 8.2 21.4'/%3E%3Cpath d='M15.8 2.6 C18.1 2.6 17.4 5.4 17.7 7.6 C17.9 9.3 18.4 10.6 20.4 12 C18.4 13.4 17.9 14.7 17.7 16.4 C17.4 18.6 18.1 21.4 15.8 21.4'/%3E%3C/g%3E%3Cg stroke-width='1.7' stroke-linecap='round'%3E%3Cline x1='9.2' y1='8' x2='12.1' y2='8' stroke='%2349cc90'/%3E%3Cline x1='9.2' y1='12' x2='13.3' y2='12' stroke='%2361affe'/%3E%3Cline x1='9.2' y1='16' x2='11.2' y2='16' stroke='%23fca130'/%3E%3C/g%3E%3Ccircle cx='13.7' cy='8' r='1.35' fill='%2349cc90'/%3E%3Ccircle cx='14.9' cy='12' r='1.35' fill='%2361affe'/%3E%3Ccircle cx='12.8' cy='16' r='1.35' fill='%23fca130'/%3E%3C/svg%3E" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <meta name="theme-color" content="#0d1117" />
  <!-- Third-party assets are vendored (see vendor/README.md for versions and
       upstream SRI hashes), so the site works fully offline / air-gapped. -->
  <link rel="stylesheet" href="vendor/swagger-ui.css" />
  <link rel="stylesheet" href="vendor/codemirror.min.css" />
  <link rel="stylesheet" href="vendor/show-hint.min.css" />
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body>
  <header class="sdui-header">
    <div class="sdui-brand">
      <svg class="sdui-logo" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
        <!-- an OpenAPI document: braces wrapping method-colored API routes -->
        <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8.2 2.6 C5.9 2.6 6.6 5.4 6.3 7.6 C6.1 9.3 5.6 10.6 3.6 12 C5.6 13.4 6.1 14.7 6.3 16.4 C6.6 18.6 5.9 21.4 8.2 21.4"/>
          <path d="M15.8 2.6 C18.1 2.6 17.4 5.4 17.7 7.6 C17.9 9.3 18.4 10.6 20.4 12 C18.4 13.4 17.9 14.7 17.7 16.4 C17.4 18.6 18.1 21.4 15.8 21.4"/>
        </g>
        <g stroke-width="1.7" stroke-linecap="round">
          <line x1="9.2" y1="8" x2="12.1" y2="8" stroke="#49cc90"/>
          <line x1="9.2" y1="12" x2="13.3" y2="12" stroke="#61affe"/>
          <line x1="9.2" y1="16" x2="11.2" y2="16" stroke="#fca130"/>
        </g>
        <circle cx="13.7" cy="8" r="1.35" fill="#49cc90"/>
        <circle cx="14.9" cy="12" r="1.35" fill="#61affe"/>
        <circle cx="12.8" cy="16" r="1.35" fill="#fca130"/>
      </svg>
      <div class="sdui-titles">
        <span class="sdui-title">OASForge</span>
        <span class="sdui-subtitle">The dark OpenAPI workbench</span>
      </div>
    </div>
    <div class="sdui-controls">
      <label class="sdui-select-wrap">
        <span class="sdui-select-label">Spec</span>
        <select id="spec-select" aria-label="Select API specification">
          <option value="demo">Demo API — full feature showcase</option>
          <option value="petstore">Swagger Petstore (live)</option>
          <option value="custom">My API — YAML editor</option>
        </select>
      </label>
      <button id="edit-spec" class="sdui-edit-btn" type="button" title="Open an editable copy of this spec in the YAML editor">✎ Edit a copy</button>
      <div id="layout-switch" class="sdui-seg" role="group" aria-label="Editor layout" hidden>
        <button type="button" data-layout="editor" title="Editor only (hide preview)">Editor</button>
        <button type="button" data-layout="split" title="Editor and preview side by side">Split</button>
        <button type="button" data-layout="preview" title="Preview only (hide editor)">Preview</button>
      </div>
      <select id="palette-select" aria-label="Color palette" title="Color palette">
        <option value="default">Default</option>
        <option value="nord">Nord</option>
        <option value="dracula">Dracula</option>
        <option value="catppuccin">Catppuccin</option>
      </select>
      <button id="guide-open" class="sdui-toggle" type="button" aria-label="Open the user guide" title="User guide (F1)">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
          <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                d="M9.4 9.2a2.7 2.7 0 0 1 5.2 1c0 1.8-2.6 2.1-2.6 3.6"/>
          <circle cx="12" cy="17.2" r="0.6" fill="currentColor" stroke="currentColor"/>
        </svg>
      </button>
      <button id="fullscreen-toggle" class="sdui-toggle" type="button" aria-label="Toggle full screen" title="Toggle full screen">
        <svg class="icon-expand" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
        </svg>
        <svg class="icon-compress" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>
        </svg>
      </button>
      <button id="theme-toggle" class="sdui-toggle" type="button" aria-label="Toggle dark / light theme" title="Toggle theme">
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M12.1 22c-5.5 0-10-4.5-10-10 0-4.6 3.1-8.6 7.6-9.7.6-.2 1.1.5.8 1-.5 1.1-.8 2.3-.8 3.5 0 4.4 3.6 8 8 8 1.2 0 2.4-.3 3.5-.8.5-.3 1.2.2 1 .8-1.2 4.4-5.2 7.2-10.1 7.2z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-15h.01M12 21h.01M4.2 4.2l.01.01M19.8 19.8l.01.01M2 12h.01M22 12h.01M4.2 19.8l.01-.01M19.8 4.2l.01-.01"/>
          <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="12" y1="1.5" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22.5"/>
            <line x1="1.5" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22.5" y2="12"/>
            <line x1="4.6" y1="4.6" x2="6.4" y2="6.4"/><line x1="17.6" y1="17.6" x2="19.4" y2="19.4"/>
            <line x1="4.6" y1="19.4" x2="6.4" y2="17.6"/><line x1="17.6" y1="6.4" x2="19.4" y2="4.6"/>
          </g>
        </svg>
      </button>
      <a class="sdui-gh" href="https://github.com/dikeckaan/swagger-dark-ui" target="_blank" rel="noopener" aria-label="View source on GitHub" title="View source on GitHub">
        <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </svg>
      </a>
    </div>
  </header>

  <div id="workspace">
    <aside id="editor-pane" hidden>
      <div class="sdui-editor-toolbar">
        <div class="sdui-doc-controls">
          <select id="doc-select" aria-label="Saved specs" title="Your saved specs"></select>
          <input id="doc-rename-input" type="text" aria-label="New name" hidden />
          <button id="doc-new" class="sdui-tool-btn" type="button" title="Create a new spec from the starter template">New</button>
          <button id="doc-rename" class="sdui-tool-btn" type="button" title="Rename this spec">Rename</button>
          <button id="doc-delete" class="sdui-tool-btn" type="button" title="Delete this spec">Delete</button>
          <div class="sdui-insert">
            <button id="doc-history" class="sdui-tool-btn" type="button" title="Snapshots of this spec — restore or diff">History</button>
            <div id="doc-history-menu" class="sdui-menu" hidden></div>
          </div>
        </div>
        <div class="sdui-editor-actions">
          <div class="sdui-insert">
            <button id="editor-insert" class="sdui-tool-btn" type="button" title="Insert OpenAPI building blocks — endpoints, operations, parameters, schemas…">＋ Insert</button>
            <div id="editor-insert-menu" class="sdui-menu" hidden></div>
          </div>
          <div class="sdui-btn-group">
            <button id="editor-find" class="sdui-icon-btn" type="button" title="Find in code (Ctrl/Cmd+F)" aria-label="Find in code">
              <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
                <circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
                <path d="m15.5 15.5 5.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <div class="sdui-btn-group" role="group" aria-label="Edit history">
            <button id="editor-undo" class="sdui-icon-btn" type="button" title="Undo (Ctrl/Cmd+Z)" aria-label="Undo">
              <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
                <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                      d="M8.5 5.5 4 10l4.5 4.5M4 10h10a6 6 0 0 1 0 12h-3"/>
              </svg>
            </button>
            <button id="editor-redo" class="sdui-icon-btn" type="button" title="Redo (Ctrl/Cmd+Shift+Z)" aria-label="Redo">
              <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
                <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                      d="M15.5 5.5 20 10l-4.5 4.5M20 10H10a6 6 0 0 0 0 12h3"/>
              </svg>
            </button>
          </div>
          <button id="editor-copy" class="sdui-tool-btn sdui-btn-icon-label" type="button" title="Copy the whole spec to the clipboard">
            <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true">
              <rect x="9" y="9" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
              <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            Copy
          </button>
          <button id="editor-share" class="sdui-tool-btn" type="button" title="Copy a shareable link that embeds this spec">Share</button>
          <button id="editor-convert" class="sdui-tool-btn" type="button" title="Convert between YAML and JSON">To JSON</button>
          <button id="editor-load-url" class="sdui-tool-btn" type="button" title="Fetch a spec from a URL into the editor">Load URL</button>
          <button id="editor-open-file" class="sdui-tool-btn" type="button" title="Open a local YAML/JSON file">Open file</button>
          <button id="editor-download" class="sdui-tool-btn" type="button" title="Download the current spec (Cmd/Ctrl+S)">Download</button>
          <div class="sdui-insert">
            <button id="editor-export" class="sdui-tool-btn" type="button" title="Export as a Postman collection or standalone HTML docs">Export</button>
            <div id="editor-export-menu" class="sdui-menu" hidden></div>
          </div>
          <button id="editor-reset" class="sdui-tool-btn" type="button" title="Replace the editor content with the starter template">Reset</button>
        </div>
        <input id="editor-file-input" type="file" accept=".yaml,.yml,.json,.txt" hidden />
      </div>
      <div id="editor-url-row" hidden>
        <input id="editor-url-input" type="url" placeholder="https://api.example.com/openapi.yaml (server must allow CORS)" spellcheck="false" />
        <button id="editor-url-go" class="sdui-tool-btn" type="button">Fetch</button>
        <button id="editor-url-cancel" class="sdui-tool-btn" type="button">Cancel</button>
      </div>
      <div id="editor-findbar" hidden>
        <input id="findbar-input" type="text" placeholder="Find in code… (Enter: next · Shift+Enter: previous · Esc: close)" />
        <span id="findbar-count"></span>
        <button id="findbar-prev" class="sdui-tool-btn" type="button" title="Previous match (Shift+Enter)">↑</button>
        <button id="findbar-next" class="sdui-tool-btn" type="button" title="Next match (Enter)">↓</button>
        <button id="findbar-close" class="sdui-tool-btn" type="button" title="Close (Esc)">×</button>
      </div>
      <div id="editor-host"></div>
      <div id="editor-convert20" hidden>
        <span>This is a Swagger 2.0 document — the editor's tooling targets OpenAPI 3.</span>
        <button id="editor-convert20-go" class="sdui-tool-btn" type="button">Convert to OpenAPI 3</button>
      </div>
      <div id="issues-handle" class="sdui-row-handle" title="Drag to resize the issues panel · double-click to reset" hidden></div>
      <ul id="editor-issues" aria-label="Validation issues" hidden></ul>
      <div id="editor-status" class="ok" role="status">Valid — rendering live</div>
      <div id="split-handle" title="Drag to resize the editor · double-click to reset"></div>
    </aside>
    <main id="preview-pane">
      <div id="preview-search">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
          <circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="m15.5 15.5 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="opsearch-input" type="search"
               placeholder="Search operations — path, method, summary, parameters, schema fields, status codes…" />
        <span id="opsearch-count"></span>
      </div>
      <div id="swagger-ui" aria-live="polite"></div>
    </main>
  </div>

  <script src="vendor/swagger-ui-bundle.js"></script>
  <script src="vendor/codemirror.min.js"></script>
  <script src="vendor/yaml.min.js"></script>
  <script src="vendor/show-hint.min.js"></script>
  <script src="vendor/searchcursor.min.js"></script>
  <script src="vendor/js-yaml.min.js"></script>
  <script src="vendor/lz-string.min.js"></script>
  <script src="js/validate.js"></script>
  <script src="js/snippets.js"></script>
  <script src="js/constraints.js"></script>
  <script src="js/findbar.js"></script>
  <script src="js/guide.js"></script>
  <script src="js/opsearch.js"></script>
  <script src="js/autocomplete.js"></script>
  <script src="js/quickfix.js"></script>
  <script src="js/convert20.js"></script>
  <script src="js/history.js"></script>
  <script src="js/export.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/postman.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Installable app: register the service worker (relative path, so it
    // also works when the site is served from a sub-path).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {
          /* e.g. file:// or an unsupported browser — the site works without it */
        });
      });
    }
  </script>
</body>
</html>
